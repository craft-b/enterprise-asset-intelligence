# docker-compose.yml
# Enterprise Asset Intelligence — Full Stack
#
# Starts four services:
#   - client:      React frontend (Nginx)   → http://localhost
#   - server:      Node.js API gateway      → http://localhost:5000
#   - ml-service:  FastAPI ML service       (internal only)
#   - db:          MySQL 8                  (internal only)
#
# This is a complete, self-contained instance. Nothing has to be provisioned
# anywhere: the database runs in the stack, docker-entrypoint.sh applies the
# migrations on boot, and the /setup screen seeds the demo fleet. Fork it,
# change it, break it -- it is yours and it touches nothing else.
#
# The browser always talks to the HOST ports above.
# Inter-service calls use Docker DNS: http://ml-service:8000
#
# Requirements: 16 GB RAM recommended, Docker Desktop 4.x+
#
# Usage:
#   npm run setup:env             # writes .env with freshly generated secrets
#   docker-compose up --build     # first run (builds all images)
#   docker-compose up             # subsequent runs
#   docker-compose down           # stop + remove containers
#   docker-compose logs -f ml-service

version: "3.9"

services:

  # ── React Frontend (Nginx) ───────────────────────────────────────────────
  # VITE_ vars are baked in at image build time — pass them as build args,
  # not runtime environment variables.
  client:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.client
      args:
        # Nginx proxies /api → server:5000, so the browser uses relative paths.
        # Override only if you're deploying client and server on different domains.
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Node.js API Gateway ──────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.server
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:-mysql://eai:eai@db:3306/enterprise_assets}
      SESSION_SECRET: ${SESSION_SECRET}
      # Creates the admin/viewer accounts the login page names. On by default
      # HERE and nowhere else: this stack publishes no port but 80 on the
      # local machine, so published credentials cost nothing. A deployment
      # leaves it unset and takes the first-registration admin instead.
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      JWT_SECRET: ${JWT_SECRET}
      # Resolved via Docker DNS — never use localhost here
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN}
      MODEL_VERSION: ${MODEL_VERSION:-v1}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Python FastAPI ML Service ────────────────────────────────────────────
  ml-service:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.ml-service
    # SEC-1: no host `ports:` mapping — the ML plane is reachable only from other
    # containers on the internal network (via `http://ml-service:8000`), never
    # from the host. Combined with the X-Service-Token check this closes the
    # "anyone can trigger training / promote a model" exposure.
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production          # Python convention, not NODE_ENV
      ML_SERVICE_PORT: 8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN}
      # SQLAlchemy reads the individual DB_* vars; they and DATABASE_URL must
      # describe the same database. The defaults point at the `db` service, so
      # they already agree.
      DATABASE_URL: ${DATABASE_URL:-mysql://eai:eai@db:3306/enterprise_assets}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-eai}
      DB_PASSWORD: ${DB_PASSWORD:-eai}
      DB_NAME: ${DB_NAME:-enterprise_assets}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      # llama3-8b-8192 is deprecated on Groq — default to the current model
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      # LLM-1: recommendations are opt-in; off = deterministic template only
      GENAI_RECOMMENDATIONS: ${GENAI_RECOMMENDATIONS:-off}
      # Local stack: docs are useful here and nothing is exposed beyond the
      # host. Deployments leave this unset -- see docs/DEPLOYMENT.md.
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      MODEL_VERSION: ${MODEL_VERSION:-v1}
    volumes:
      # Model artifacts persist across container rebuilds.
      # Train once locally, ship the registry dir — no retraining on start.
      # Path matches WORKDIR /app/ml-service inside the container.
      - ./ml-service/registry:/app/ml-service/registry
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  # ── MySQL ──────────────────────────────────────────────────────
  # The deployed stack runs on TiDB Cloud Serverless, which is
  # MySQL-compatible; this is the local equivalent of it. It exists so that a
  # clone of this repository is a working instance rather than a working
  # instance minus a database you have to go and provision.
  #
  # No host `ports:` mapping, for the same reason ml-service has none: nothing
  # here should be reachable from outside the stack. To look inside it:
  #   docker compose exec db mysql -u eai -p enterprise_assets
  #
  # UTC explicitly. Every date in this system is load-bearing -- the
  # simulation cursor, snapshot dates, the point-in-time feature rule -- and
  # TiDB serves UTC, so a local stack on a different zone would compute
  # different features from the same seed.
  db:
    image: mysql:8.4
    command: --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${DB_NAME:-enterprise_assets}
      MYSQL_USER: ${DB_USER:-eai}
      MYSQL_PASSWORD: ${DB_PASSWORD:-eai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-eai-root}
    expose:
      - "3306"
    volumes:
      # Named volume: the fleet you build survives `docker compose down`.
      # `docker compose down -v` is the deliberate way to throw it away.
      - eai-db-data:/var/lib/mysql
    healthcheck:
      # The other services wait on this. Without it the server starts first,
      # runs migrations against a database still initialising, and exits 1 --
      # which the entrypoint is right to do and is a confusing first run.
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -u
        - root
        - -p${MYSQL_ROOT_PASSWORD:-eai-root}
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

# ── Persistent data ──────────────────────────────────────────────
volumes:
  eai-db-data:

# ── Shared network ───────────────────────────────────────────────────────────
# All three containers join this network automatically.
# Inter-service calls use service name as hostname (e.g. http://ml-service:8000).
# The ML service is `expose`-only (internal), so it is never bound to the host.
networks:
  default:
    name: enterprise-asset-network