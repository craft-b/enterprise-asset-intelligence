# render.yaml — Render Blueprint for Enterprise Asset Intelligence
#
# Two Docker web services:
#   eai-api  Node/Express API + the built React SPA   (public)
#   eai-ml   FastAPI ML service                       (public, token-gated)
#
# The database is NOT defined here. Render offers Postgres only, and this stack
# is MySQL-specific (drizzle-orm/mysql2 on the Node side, pymysql on the Python
# side), so MySQL is supplied externally — TiDB Cloud Serverless has a free
# tier and is wire-compatible. See docs/DEPLOYMENT.md for the full walkthrough.
#
# ── Free-tier caveats, stated plainly ────────────────────────────────────────
# `plan: free` means an instance is suspended after ~15 minutes without
# inbound traffic and takes 30-60s to wake. Consequences:
#
#   * The ML service sleeps independently of the API, so the first prediction
#     after an idle period pays that cold start. ML_HEALTH_TIMEOUT_MS and
#     ML_TIMEOUT_MS below are raised accordingly; with the code defaults
#     (3s / 10s) every such request would fail.
#   * Free tier has no persistent disk, so the model registry starts empty on
#     every wake. The champion bundle is committed and baked into the image at
#     build time, so this costs nothing at runtime. Training in 512MB is not
#     realistic, so the image shipping a model is what makes predictions work.
#   * Free instance hours are pooled across all free services in the account,
#     so keeping both of these warm with an external pinger would exhaust the
#     monthly allowance. Let them sleep.
#
# Upgrading to paid: set `plan: starter` on eai-api, `plan: standard` on eai-ml
# (512MB is tight for sklearn + SHAP; measured steady state is ~340MB), and add
# a disk to eai-ml mounted at /app/ml-service/registry so trained artifacts
# persist across deploys rather than coming from the image each time.

envVarGroups:
  # ML_SERVICE_TOKEN must be IDENTICAL on both services: Node sends it as
  # X-Service-Token, the FastAPI middleware compares it. A group is the only
  # way to have Render generate one secret shared by two services.
  #
  # It must also be non-empty. The ML service's auth middleware is a no-op when
  # the variable is blank, which on a public service means /train and
  # /models/promote would be open to anyone.
  - name: eai-shared
    envVars:
      - key: ML_SERVICE_TOKEN
        generateValue: true

services:
  # ── Node API + SPA ────────────────────────────────────────────────────────
  - type: web
    name: eai-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Unauthenticated and does not touch the database, so it reports process
    # liveness rather than readiness.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Stated as exclusions rather than inclusions: the build context is the
    # repo root, so almost everything is genuinely an input. The Node image
    # does not run the Python service, and prose is not an input at all.
    buildFilter:
      ignoredPaths:
        - ml-service/**
        - "**/*.md"
    envVars:
      - fromGroup: eai-shared

      - key: NODE_ENV
        value: production

      # Gates the secure/sameSite cookie flags AND is enforced by
      # resolveSessionSecret(), which refuses to boot in production without a
      # real secret. Render generates a 32+ char value, so this is satisfied.
      - key: SESSION_SECRET
        generateValue: true

      # Set in the dashboard — it carries the database password.
      # TiDB requires TLS, which mysql2 reads from the DSN query string:
      #   mysql://USER:PASS@gateway01.<region>.prod.aws.tidbcloud.com:4000/eai
      #     ?ssl={"minVersion":"TLSv1.2","rejectUnauthorized":true}
      # Without the ssl parameter the connection is rejected.
      - key: DATABASE_URL
        sync: false

      # The SPA is hosted separately (static host), so the browser calls this
      # API cross-origin. Set this to the exact frontend origin, e.g.
      #   https://enterprise-asset-intelligence.vercel.app
      # Comma-separated for more than one. A wildcard is refused at boot:
      # the session cookie means credentialed requests, and browsers reject
      # a wildcard Allow-Origin alongside Allow-Credentials.
      # Empty on the default (proxy) topology: Vercel forwards /api to this
      # service, so the browser sees one origin and there is no cross-origin
      # request to allow. Left as a value rather than a prompt so applying
      # the blueprint does not ask for something most setups must leave
      # blank -- and because a wrong value here fails the boot by design.
      - key: ALLOWED_ORIGINS
        value: ""

      # Full https:// origin of eai-ml. Render cannot compose a URL from
      # another service's host in a blueprint, so paste it after the first
      # deploy: https://eai-ml.onrender.com (confirm the exact name — Render
      # appends a suffix if the name is taken).
      - key: ML_SERVICE_URL
        sync: false

      # Raised for free-tier cold starts; see the note at the top.
      - key: ML_HEALTH_TIMEOUT_MS
        value: "90000"
      - key: ML_TIMEOUT_MS
        value: "120000"
      # How long the seed keeps trying to wake a suspended ML service, and the
      # ceiling on any one health probe. A suspended instance holds the
      # connection open for the whole cold start (measured 51-62s), so without
      # a per-probe bound the budget buys a single attempt.
      - key: ML_WAKE_TIMEOUT_MS
        value: "300000"
      - key: ML_WAKE_PROBE_MS
        value: "120000"

      - key: MODEL_VERSION
        value: v1

      # Bearer token for /api/agent/*, which the README advertises and which
      # answers 503 until this is set. Nothing issues this token: the server
      # only compares an incoming Authorization header against it, so letting
      # Render generate a random value is enough -- read it out of the
      # dashboard when monitor.py needs to send it. Left unset, the agent
      # endpoints are simply off: a safe default, but a dead link in the docs.
      - key: AGENT_API_KEY
        generateValue: true

      # Creates the admin/viewer accounts the login page advertises. On a
      # public demo those credentials have to work: a sign-in screen naming
      # credentials that do not exist loses the visitor, and asking them to
      # register first loses most of the rest. Enabled HERE rather than by
      # default because these are published passwords on an account that can
      # modify equipment and reseed the database -- correct for synthetic
      # demo data, wrong anywhere real.
      - key: SEED_DEMO_USERS
        value: "true"

  # ── FastAPI ML service ────────────────────────────────────────────────────
  - type: web
    name: eai-ml
    runtime: docker
    plan: free
    region: oregon
    # Its Dockerfile does `COPY requirements.txt .` relative to ml-service/,
    # so the build context is that directory, not the repo root.
    dockerfilePath: ./ml-service/Dockerfile
    dockerContext: ./ml-service
    # Exempt from the service-token middleware so Render can poll it.
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Only rebuild when this service's own files change.
    #
    # Without this every commit to the repo rebuilt the image: reinstalling
    # scikit-learn, pandas and shap and refetching a 16.7MB model bundle on a
    # free instance, which runs 15+ minutes and queues behind itself. Seven
    # consecutive commits that touched no Python did exactly that, and two
    # builds ended up in flight at once.
    #
    # The build context above is ./ml-service, so nothing outside it can
    # affect the image anyway; render.yaml is included because it carries this
    # service's own configuration.
    buildFilter:
      paths:
        - ml-service/**
        - render.yaml
    envVars:
      - fromGroup: eai-shared

      - key: ENVIRONMENT
        value: production

      # The Python side prefers DATABASE_URL over the DB_* vars (see
      # engine/db_url.py) and translates mysql2's ssl parameter into the
      # spelling pymysql understands, so this is the same string as eai-api's.
      # One DSN for both services, which also removes the old footgun of
      # DATABASE_URL and DB_* drifting apart.
      - key: DATABASE_URL
        sync: false

      # Optional. The champion bundle is committed and baked into the image, so
      # this is only needed to override it with an externally hosted archive.
      # Left empty: a GitHub release asset was the original design and GitHub
      # serves 502s to Render's addresses, which is why the bundle moved into
      # the repo.
      - key: MODEL_BUNDLE_URL
        value: ""
      # Pinned digest of that archive. The archive contains pickles, and
      # unpickling executes code, so a swapped asset would otherwise turn a
      # restart into arbitrary code execution. Update when the bundle changes.
      - key: MODEL_BUNDLE_SHA256
        value: 2ac9c74f87ce7610229fdb9c31fbd9fef1a9c5439d0337d8615fc09cc3900ed4

      # Deterministic template recommendations. Turning this on additionally
      # needs GROQ_API_KEY.
      - key: GENAI_RECOMMENDATIONS
        value: "off"

      # Swagger/ReDoc/openapi.json. Stated explicitly rather than left
      # absent: they have to bypass the service-token check to function, so
      # serving them here would publish every path and schema of a service
      # whose endpoints are otherwise gated. Flip to "true" only if you
      # want the API browsable by anyone with the URL.
      - key: ENABLE_API_DOCS
        value: "false"

      - key: MODEL_VERSION
        value: v1
      - key: PYTHONIOENCODING
        value: utf-8
