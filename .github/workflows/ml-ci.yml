name: ML Pipeline CI

on:
  push:
    branches: [main, feat/**]
    paths:
      - "ml-service/**"
      - "server/**"
      - "client/**"
      - "shared/**"
      # migrations/ and drizzle.config.ts were missing, and the gap only
      # became visible once this workflow started applying migrations to a
      # real database: the commit that fixed a migration could not trigger the
      # job that would have checked it. Drizzle owns the schema (ARCH-1), so a
      # change here is exactly the kind that needs the suite run.
      - "migrations/**"
      - "drizzle.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/ml-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ml-service/**"
      - "server/**"
      - "client/**"
      - "shared/**"
      # migrations/ and drizzle.config.ts were missing, and the gap only
      # became visible once this workflow started applying migrations to a
      # real database: the commit that fixed a migration could not trigger the
      # job that would have checked it. Drizzle owns the schema (ARCH-1), so a
      # change here is exactly the kind that needs the suite run.
      - "migrations/**"
      - "drizzle.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vitest.config.ts"
      - ".github/workflows/ml-ci.yml"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install ruff
        run: pip install ruff==0.9.7

      - name: Lint ml-service
        run: ruff check ml-service/ --select E,F,W --ignore E501,W291,W293

  smoke-test:
    name: Training smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # ML core for the in-memory smoke test. sqlalchemy is required because
          # train_model_multihorizon imports it at module level (DB helpers); the
          # MySQL driver (pymysql) is still omitted — the smoke test never connects.
          # imbalanced-learn was dropped with SMOTE (ML-5).
          pip install \
            scikit-learn==1.8.0 \
            sqlalchemy==2.0.46 \
            numpy==2.4.1 \
            pandas==2.3.3 \
            joblib==1.5.3 \
            scipy==1.17.0 \
            pytest==8.3.5 \
            pytest-timeout==2.3.1

      - name: Run smoke tests
        run: python -m pytest tests/test_train_smoke.py -v --timeout=120
        env:
          # Disable MLflow and DB — smoke test is fully in-memory
          MLFLOW_TRACKING_URI: ""

      - name: Post metrics summary
        if: always()
        run: |
          python -m pytest tests/test_train_smoke.py -v --timeout=120 \
            --tb=no -q 2>/dev/null || true
          echo "### ML Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python - <<'EOF'
          import sys, json
          sys.path.insert(0, ".")
          from tests.test_train_smoke import make_synthetic_df, HORIZONS
          from training.train_model_multihorizon import prepare_features, train_horizon_model
          import tempfile, pathlib, os
          import training.train_model_multihorizon as tm

          tmp = pathlib.Path(tempfile.mkdtemp())
          tm.MODEL_DIR = tmp
          tm.MODEL_DIR.mkdir(parents=True, exist_ok=True)

          df = make_synthetic_df(600)
          X, labels, feature_names, _ = prepare_features(df, "ci")

          import pandas as pd
          _empty_fail = pd.DataFrame({
              "equipment_id": pd.Series(dtype=int),
              "maintenance_date": pd.Series(dtype="datetime64[ns]"),
          })

          rows = ["| Horizon | ROC-AUC | PR-AUC | Recall (fail) | Precision (fail) |",
                  "|---------|---------|--------|---------------|-----------------|"]
          for h in HORIZONS:
              y = labels[f"will_fail_{h}d"]
              _, m = train_horizon_model(
                  X, y, h,
                  snapshot_ts=labels["snapshot_ts"],
                  equipment_ids=labels["equipment_id"],
                  failures_df=_empty_fail,
              )
              rows.append(
                  f"| {h}d | {m['roc_auc']:.3f} | {m['pr_auc']:.3f} "
                  f"| {m['recall'][1]:.3f} | {m['precision'][1]:.3f} |"
              )
          print("\n".join(rows))
          EOF
          >> $GITHUB_STEP_SUMMARY
        env:
          MLFLOW_TRACKING_URI: ""

  typecheck:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  node-unit-tests:
    name: Node unit tests (vitest)
    runs-on: ubuntu-latest

    # The database-backed suites key on DATABASE_URL:
    #   const RUN = !!process.env.DATABASE_URL
    #   const suite = RUN ? describe : describe.skip
    #
    # Without one they skip, and a skip is green. 48 tests were skipping here
    # on every run -- among them feature-engineering-pit.test.ts, which is the
    # suite that holds the point-in-time guarantee: that a snapshot sees only
    # data at or before its own timestamp. That is the most safety-critical
    # property in the feature pipeline and the hardest to reason about by
    # eye, and it was being verified in no environment at all. It did not run
    # locally either, because a developer's DATABASE_URL points at a database
    # that is usually not running, which turns the skip into a red error
    # nobody reads.
    #
    # A service container costs about thirty seconds and converts 48 silent
    # skips into 48 assertions.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: eai_ci
        ports:
          - 3306:3306
        # Without a health check the first migration races the server's
        # startup and fails with ECONNREFUSED on a cold runner.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    env:
      DATABASE_URL: mysql://root:ci-root@127.0.0.1:3306/eai_ci
      # http-write.test.ts deliberately keys on its own variable rather than
      # DATABASE_URL, so that pointing the write-path tests at a database is
      # always a conscious act and never an accident of inheriting the one the
      # app uses. Set explicitly here for the same reason.
      TEST_DATABASE_URL: mysql://root:ci-root@127.0.0.1:3306/eai_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prove the database is reachable before blaming the migrations for
      # anything. A service container reported healthy and a driver able to
      # authenticate against it are different claims, and MySQL 8.4 defaults
      # to caching_sha2_password, which is the usual reason the second fails
      # while the first succeeded.
      - name: Check the database is reachable
        run: |
          node -e '
            const mysql = require("mysql2/promise");
            (async () => {
              for (let i = 1; i <= 20; i++) {
                try {
                  const c = await mysql.createConnection(process.env.DATABASE_URL);
                  const [rows] = await c.query("SELECT VERSION() AS v");
                  console.log("connected to MySQL", rows[0].v);
                  await c.end();
                  return;
                } catch (e) {
                  console.log(`attempt ${i}: ${e.code || e.message}`);
                  await new Promise(r => setTimeout(r, 2000));
                }
              }
              console.log("::error::CI database unreachable from the runner");
              process.exit(1);
            })();
          '

      # Drizzle owns the schema (ARCH-1), so the test database is built the
      # same way the deployed one is rather than from a fixture that can
      # drift away from the migrations.
      #
      # The output is echoed into an ::error:: annotation on failure. Job logs
      # need admin rights to read through the API, so a bare non-zero exit is
      # a failure nobody outside the repo can diagnose -- including whoever is
      # asked to fix it.
      - name: Apply migrations
        run: |
          set +e
          out=$(npm run db:migrate 2>&1); code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            msg=$(printf '%s' "$out" | tail -c 800 | tr -s '[:space:]' ' ' | sed 's/::/-/g')
            echo "::error::db:migrate failed: $msg"
            exit 1
          fi

      # http-smoke.test.ts authenticates through /api/test-login as userId 1.
      # A freshly migrated database has no users at all, so the bypass issued
      # no session and every endpoint it then checked returned 401 -- nine
      # assertion failures with one cause. The suite was written against a
      # database that had been seeded at least once, which was true of every
      # environment it had ever run in, because until now it had only ever run
      # where someone had already seeded.
      #
      # Seeding the two advertised accounts is the smallest thing that makes
      # the assumption true, and it is the same seeder the deployment uses, so
      # CI is not authenticating through a path production does not have.
      - name: Seed the demo accounts
        env:
          SEED_DEMO_USERS: "true"
        run: |
          npx tsx -e "
            import { seedDemoUsers } from './server/seeds/demo-users.ts';
            const r = await seedDemoUsers();
            console.log('created:', r.created, 'skipped:', r.skipped);
            if (r.created.length === 0 && r.skipped.length === 0) {
              console.log('::error::demo user seed created nothing');
              process.exit(1);
            }
            process.exit(0);
          "

      - name: Run unit tests
        run: npm test

      # The point of the service container is that these stop skipping. If a
      # future change drops the database from this job the suite returns to
      # being green and empty, which is the state it was in before and the one
      # thing a test job must not do quietly.
      #
      # Asserted on the reporter's own count rather than by grepping output
      # for the word "skipped", which matches test names and reporter chrome.
      - name: Fail if the point-in-time suite did not actually run
        run: |
          npx vitest run server/services/feature-engineering-pit.test.ts             --reporter=json --outputFile=/tmp/pit.json
          node -e '
            const r = require("/tmp/pit.json");
            const passed = r.numPassedTests ?? 0;
            const skipped = (r.numPendingTests ?? 0) + (r.numTodoTests ?? 0);
            console.log(`point-in-time suite: ${passed} passed, ${skipped} skipped`);
            if (skipped > 0 || passed === 0) {
              console.error("::error::the point-in-time suite did not run — the database is not reaching it");
              process.exit(1);
            }
          '
